<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin Terminal</title>
    <style>
        :root { --axis: #ae285d; --bg: #0d0d0d; --google-blue: #1a73e8; --google-red: #d93025; }
        body { margin: 0; padding: 0; font-family: 'Roboto', 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; }
        
        /* Dashboard Background Blur */
        .dashboard-bg {
            padding: 20px;
            filter: blur(8px);
            opacity: 0.4;
            pointer-events: none;
            user-select: none;
        }

        /* Google Official Style Popup Overlay */
        .google-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
        }

        /* Standard Google Pixel/Material Modal */
        .google-modal {
            background: #ffffff;
            width: 85%;
            max-width: 360px;
            border-radius: 28px; /* Standard Google Shape */
            padding: 24px;
            box-shadow: 0 24px 38px 3px rgba(0,0,0,0.14);
            text-align: center;
            animation: googlePop 0.4s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes googlePop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Full Logo Display - Transparent and Clear */
        .modal-logo {
            width: 140px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 12px;
            text-align: left;
        }

        .modal-body {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.6;
            margin-bottom: 32px;
            text-align: left;
        }

        /* Google Style Buttons */
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel {
            background: transparent;
            color: var(--google-blue);
        }

        .btn-delete {
            background: var(--google-red);
            color: white;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3);
        }

        .btn:active { background-color: #f1f3f4; }
        .btn-delete:active { background-color: #b21f16; }

        /* Fake Card Background */
        .fake-card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--axis); }
    </style>
</head>
<body>

<div class="google-overlay">
    <div class="google-modal">
        <img src="https://i.ibb.co/8nsbG6MT/images-2.png" alt="Admin Logo" class="modal-logo">
        
        <div class="modal-title">Clear Firebase Data?</div>
        
        <div class="modal-body">
            Do you want to permanently delete all device logs and database entries for project <b>hdfc99-bd497</b>? This cannot be undone.
        </div>
        
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="fakeAction()">Cancel</button>
            <button class="btn btn-delete" onclick="fakeAction()">Delete</button>
        </div>
    </div>
</div>

<div class="dashboard-bg">
    <div style="color: var(--axis); font-weight: bold; font-size: 20px; margin-bottom: 20px;">ELITE CONTROL V2</div>
    <div class="fake-card">ID: Device_001 - <span style="color: #2ecc71;">Active</span></div>
    <div class="fake-card">ID: Device_002 - <span style="color: #2ecc71;">Active</span></div>
    <div class="fake-card">ID: Device_003 - <span style="color: #888;">Standby</span></div>
</div>

<script>
    // Yeh function sirf ek fake loading dikhayega
    function fakeAction() {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "...";
        
        setTimeout(() => {
            alert("Security Protocol 09: Connection timed out. Data is safe.");
            btn.innerText = originalText;
        }, 1200);
    }

    // Modal ko piche se block karne ke liye
    document.addEventListener('contextmenu', event => event.preventDefault());
</script>

</body>
</html>
